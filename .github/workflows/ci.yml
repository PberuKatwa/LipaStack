name: CI

on:
  push:
  pull_request:
    branches: [main,dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI ( Lint, Style Check, Build )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Style check (Prettier)
        run: npm run stylecheck

      - name: Build
        run: npm run build
